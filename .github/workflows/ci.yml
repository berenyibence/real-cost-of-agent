# The whole build. There is nothing to install, so there is nothing to cache and
# no lockfile to restore — `npm ci` would fail here, and correctly so.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test · node ${{ matrix.node }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 20.11 is the floor `engines` claims, so it is tested rather than
        # assumed. All three operating systems are here because this app reads
        # paths off somebody's disk and writes a preference file into their
        # profile, and both of those differ on Windows in ways that produce a
        # plausible wrong answer rather than an error.
        #
        # macOS runs one Node rather than three: it shares every path decision
        # with Linux, so what is being checked there is the platform, not the
        # matrix. Windows is the one that disagrees, and it runs the lot.
        os: [ubuntu-latest, windows-latest]
        node: ['20.11', '22', '24']
        include:
          - os: macos-latest
            node: '22'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: No dependencies, and it stays that way
        shell: bash
        run: |
          if node -e "const p=require('./package.json');process.exit(Object.keys(p.dependencies??{}).length+Object.keys(p.devDependencies??{}).length?1:0)"; then
            echo "package.json declares no dependencies"
          else
            echo "::error file=package.json::This project ships zero dependencies. See CONTRIBUTING.md."
            exit 1
          fi

      # This is the whole suite, and it includes the smoke test: `test/smoke.test.js`
      # boots server/index.js, hits every route, and checks the policy header,
      # the traversal refusals and the access rules. That used to be a shell
      # block in this file, which meant the assertions most likely to differ on
      # Windows were the ones only ever checked on Linux.
      - run: npm test

  package:
    name: the published tarball is the whole app · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # `files` in package.json is an allowlist, so anything new under web/ or
      # server/ that is not covered by it is missing from the published package
      # and nowhere else. That failure never shows up in a clone — only for
      # somebody running `npx real-cost-of-agent`, which is now the documented
      # way in. So the tarball gets installed and exercised like a user's.
      #
      # On Windows that also exercises two shims that do not exist on Linux:
      # `npm.cmd`, and the `.cmd` wrapper npm generates for `bin` at install
      # time. `npx real-cost-of-agent` there goes through both.
      - run: node scripts/package-check.mjs
