<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 64" width="340" height="64" role="img" aria-label="Real Cost of Agent — what your agent would have cost">
  <!--
    The lockup: mark, name, tagline.

    Text rather than outlined paths, so it stays editable and diffable and
    weighs nothing. The trade is that it renders in whatever the viewer has —
    fine for a README, which is already at the mercy of the same stack. Anything
    that must render identically everywhere (a conference slide, a store
    listing) should be exported from this rather than linked to it.
  -->
  <defs>
    <linearGradient id="rcoa-brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c87ff" />
      <stop offset="1" stop-color="#34d399" />
    </linearGradient>
  </defs>

  <g transform="translate(4 14) scale(1.5)" fill="none" stroke="url(#rcoa-brand)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 2.5h14v17.4l-2.33 1.6-2.34-1.6-2.33 1.6-2.33-1.6-2.34 1.6L5 19.9Z" />
    <path d="M14.4 8.4A2.6 2.6 0 0 0 12 7.2c-1.45 0-2.6.8-2.6 1.95s1.15 1.95 2.6 1.95 2.6.8 2.6 1.95-1.15 1.95-2.6 1.95a2.6 2.6 0 0 1-2.4-1.2" />
    <path d="M12 5.6v10.8" />
  </g>

  <text x="50" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif"
        font-size="19" font-weight="700" letter-spacing="2.4" fill="#e8ecf5">REAL COST OF AGENT</text>
  <text x="51" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif"
        font-size="12.5" font-weight="400" fill="#67718a">What your agent would have cost.</text>
</svg>
