<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="Real Cost of Agent — what your agent would have cost">
  <!--
    The repository's social preview: the card GitHub, Slack and every link
    unfurler shows for the repo itself.

    Deliberately carries no numbers. The in-app share card is the one with your
    figures on it; this is the one strangers see before they have any, and a
    stranger's first impression of a money tool should not be somebody else's
    bill.

    GitHub's repository settings want a PNG or JPG, so export this before
    uploading it:

      rsvg-convert -w 1280 -h 640 web/brand/social-preview.svg -o social-preview.png

    Any SVG rasteriser will do, including opening this file in a browser and
    taking a screenshot at 1280×640.
  -->
  <defs>
    <linearGradient id="rcoa-number" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9cdff" />
      <stop offset="0.55" stop-color="#7c87ff" />
      <stop offset="1" stop-color="#34d399" />
    </linearGradient>
    <radialGradient id="rcoa-glow-a" cx="0.12" cy="0.05" r="0.75">
      <stop offset="0" stop-color="#7c87ff" stop-opacity="0.22" />
      <stop offset="1" stop-color="#0a0c11" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="rcoa-glow-b" cx="0.95" cy="1" r="0.7">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.16" />
      <stop offset="1" stop-color="#0a0c11" stop-opacity="0" />
    </radialGradient>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif; }
      .mono { font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1280" height="640" fill="#0a0c11" />
  <rect width="1280" height="640" fill="url(#rcoa-glow-a)" />
  <rect width="1280" height="640" fill="url(#rcoa-glow-b)" />
  <rect x="32" y="32" width="1216" height="576" rx="26" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(78 66) scale(2.2)" fill="none" stroke="#a5adff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 2.5h14v17.4l-2.33 1.6-2.34-1.6-2.33 1.6-2.33-1.6-2.34 1.6L5 19.9Z" />
    <path d="M14.4 8.4A2.6 2.6 0 0 0 12 7.2c-1.45 0-2.6.8-2.6 1.95s1.15 1.95 2.6 1.95 2.6.8 2.6 1.95-1.15 1.95-2.6 1.95a2.6 2.6 0 0 1-2.4-1.2" />
    <path d="M12 5.6v10.8" />
  </g>
  <text class="sans" x="146" y="93" font-size="23" font-weight="700" letter-spacing="3" fill="#e8ecf5">REAL COST OF AGENT</text>
  <text class="sans" x="147" y="118" font-size="17" fill="#67718a">What your agent would have cost.</text>

  <!-- The claim -->
  <text class="sans" x="78" y="288" font-size="19" font-weight="600" letter-spacing="3" fill="#98a2b8">CLAUDE CODE, PRICED AT API LIST RATES</text>
  <text class="sans" x="74" y="404" font-size="104" font-weight="700" fill="url(#rcoa-number)">Your number,</text>
  <text class="sans" x="74" y="486" font-size="46" font-weight="500" fill="#e8ecf5">off your own disk. Not an estimate.</text>

  <!-- The split, as a shape rather than a claim about anyone's data -->
  <g>
    <rect x="78" y="524" width="440" height="13" rx="6.5" fill="#7c87ff" />
    <rect x="450" y="524" width="180" height="13" fill="#4fb2e0" />
    <rect x="630" y="524" width="130" height="13" fill="#43c3c6" />
    <rect x="760" y="524" width="90" height="13" rx="6.5" fill="#34d399" />
    <rect x="760" y="524" width="40" height="13" fill="#34d399" />
  </g>

  <!-- Footer -->
  <text class="mono" x="78" y="586" font-size="19" font-weight="500" fill="#a5adff">github.com/berenyibence/real-cost-of-agent</text>
  <text class="sans" x="1202" y="586" font-size="19" text-anchor="end" fill="#67718a">runs locally · nothing to sign up for</text>
</svg>
